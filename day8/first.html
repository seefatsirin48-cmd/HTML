<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <form>
        <fieldset>
            <legend>IIT JEE Registration form</legend>
        <label for="fname">Full Name:</label>
        <input type="text" id="fname" name="fname" placeholder="Enter your name" required>
        <br><br>

        <label for="emailid">Email:</label>
        <input type="email" id="emailid" name="EmailId" placeholder="Enter your email">
        <br><br>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone">
        <br><br>

        <label for="pass">Password :</label>
        <input type="password" id="pass" name="Password" required>
        <br><br>

        <label>Gender:</label>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>
        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="DOB" required min="2000-01-01" max="2006-12-31">

        <br><br>

        <label for="schoolname">School Name:</label>
        <input type="text" id="schoolname" name="School Name">
        <br><br>

        <label for="board">Board:</label>
        <select id="board" name="Board">
            <option disabled selected> Select your Board</option>
            <option value="CBSE">CBSE</option>
            <option value="UP">UP</option>
            <option value="MPB">MPB</option>
            <option value="UKB">UKB</optipn>
 
        </select>
        <br><br>
        <label for="year">Year of Passing:</label>
        <input type="number" id="year" name="Year of Passing" min="2024" max="2026">
        <br><br>

        <label for="centre">Exam-Centre:</label>
        <select id="centre" name="Exam-Centre">
            <option disabled selected>Select Centre</option>
            <option value="Mumbai">Mumbai</option>
            <option value="Delhi">Delhi</option>
            <option value="Allahabad">Allahabad</option>
            <option value="lucknow">lucknow</option>

        </select>

        <br><br>
        <button>Register</button>
</fieldset>

    </form>
</body>
</html>
