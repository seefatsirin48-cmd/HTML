<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Feedback Form</h1>
    <form>
        <label for="fname">Your Name:</label>
        <input type="text" id="fname" name="fmane" placeholder="Enter your Name" required>

        <br><br>

        <label for="emailid">Your Email:</label>
        <input type="email" id="emailid" name="Emailid" placeholder="xyz@gmail.com">
        <br><br>

        <label>Rate Us:</label>
        <input type="radio" id="1" name="rateus" value="1 Star">
        <label for="1">1 Star</label>
        <input type="radio" id="2" name="rateus" value="2 Stars">
        <label for="2">2 Stars</label>
        <input type="radio" id="3" name="rateus" value="3 Stars">
        <label for="3">3 Stars</label>
        <input type="radio" id="4" name="rateus" value="4 Stars">
        <label for="4">4 Stars</label>
        <input type="radio" id="5" name="rateus" value="5 Stars">
        <label for="5">5 Stars</label>
        <br><br>

        <label for="comment">Comments:</label>
        <textarea id="comment" rows="8" cols="25"></textarea>
        <br><br>
        <button>Submit Feedback</button>

    </form>
</body>
</html>
