<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Learning how to attach audio and video on web page</h1>
    <!-- how to attach audio file -->
     <audio src="./Tu-Hai-Kahan(PaglaSongs).mp3" controls></audio>
     <br>
     <!-- other method to attach audio -->
      <audio controls>
        <source src="./Tu-Hai-Kahan(PaglaSongs).mp3">
      </audio>

      <!-- how to attach video file -->
       <br>
       <video src="./WIN_20260614_20_04_06_Pro.mp4" controls height="500" width="400" autoplay muted></video>
       <!-- another method to attach video -->
        <br>
        <video controls height="500" width="400" autoplay muted>
            <source src="./WIN_20260614_20_04_06_Pro.mp4" >
        </video>
        <br>
        <!-- You tube video how to attach -->
         <iframe src="https://www.youtube.com/embed/1pcikNlDB-4" allowfullscreen height="600" width="400">

         </iframe>

</body>
</html>
